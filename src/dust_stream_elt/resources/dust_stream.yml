# The main pipeline for dust_stream_elt

resources:
  pipelines:
    pipe_dust_stream_elt:
      name: pipe_dust_stream_elt
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/pipe_dust_stream_elt"

      # read in code with spark.conf.get("<key>")
      configuration:
        catalog: ${var.catalog}
        bronze_table: ${var.bronze_table}
        silver_table: "silver.iot_env_measurements"
        landing_path: ${var.landing_path}
        adls_base: ${var.adls_base}

      libraries:
        - glob:
            include: ../src/pipe_dust_stream_elt/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
