# The main pipeline for dust_stream_elt

resources:
  pipelines:
    dust_stream_elt_etl:
      name: dust_stream_elt_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dust_stream_elt_etl"

      libraries:
        - glob:
            include: ../src/dust_stream_elt_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
