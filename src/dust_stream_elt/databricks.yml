# This is a Declarative Automation Bundle definition for dust_stream_elt.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: pipe_dust_stream_elt
  uuid: b364a3fc-0cbe-4714-847a-51b2bacc73b9

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    default: "adb_std"
  bronze_table: 
    default: "bronze.iot_raw"
  adls_base:
    default: "abfss://iot@adls2tdstudent.dfs.core.windows.net"
  schema:
    default: "silver"

# resource definition - not in basic setup
resources:
  jobs:
    bronze_to_silver_job:
      name: "[${bundle.target}] iot bronze to silver"
      max_concurrent_runs: 1

      schedule:
        # runs every 1 hour
        quartz_cron_expression: "0 7 * * * ?" # 7 minute after hour
        timezone_id: "UTC"

      tasks:
        - task_key: bronze_to_silver
          # omit cluster key on notebook task
          notebook_task:
            notebook_path: ./src/pipe_dust_stream_elt/transformations/dust_brz_sil.py
            base_parameters:
              catalogs: ${var.catalog}
              bronze_table: ${var.bronze_table}
              silver_table: "${var.schema}.iot_env_measurements"
              adls_base: ${var.adls_base}
targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-7405618486241204.4.azuredatabricks.net
    variables:
      catalog: adb_std
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://adb-7405618486241204.4.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/21880139@student.hcmus.edu.vn to make sure we only have a single copy.
      root_path: /Workspace/Users/21880139@student.hcmus.edu.vn/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: adb_std
      bronze_table: "bronze.iot_raw"
      schema: "silver"
    permissions:
      - user_name: 21880139@student.hcmus.edu.vn
        level: CAN_MANAGE
